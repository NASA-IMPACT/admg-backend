name: CI/CD

on:
  - push

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: psf/black@stable

  deploy-to-staging:
    needs: run-linters
    if: github.ref_name == 'dev'
    concurrency: staging
    uses: "./.github/workflows/deploy.yml"
    with:
      environment: dev
    secrets: inherit # pass all secrets

  deploy-to-production:
    needs: run-linters
    if: github.ref_name == 'prod'
    concurrency: production
    uses: "./.github/workflows/deploy.yml"
    with:
      environment: prod
    secrets: inherit # pass all secrets

  notify-slack-staging:
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - name: Get first line of commit message
        id: commit-msg
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: echo "::set-output name=first-line::${COMMIT_MSG%%$'\n*'}"

  notify-slack-production:
    needs: deploy-to-production
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - name: Get first line of commit message
        id: commit-msg
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: echo "::set-output name=first-line::${COMMIT_MSG%%$'\n*'}"

      - name: Post to a Slack channel
        id: slack
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: "admg"
          payload: '{"text":"Successfully deployed MI to Production! <https://admg.nasa-impact.net/|Click here> to take a look!"}'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
